
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAIR GLOW</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>HAIR GLOW</h1>
    <p>Beauty Starts With Healthy Hair</p>
  </header>

  <section class="products">
    <h2>OUR PRODUCTS</h2>

    <div class="product">
      <h3>Hair Shampoo</h3>
      <img src="images/shampoo.png" width="200" alt="Hair Shampoo">
      <p>SKU: HG001</p>
      <p>159 Baht</p>
    </div>

    <div class="product">
      <h3>Hair Serum</h3>
      <img src="images/serum.png" width="200" alt="Hair Serum">
      <p>SKU: HG002</p>
      <p>199 Baht</p>
    </div>
  </section>

</body><section class="order">
  <h2>PLACE YOUR ORDER</h2>

  <form id="orderForm">
    <label>Customer Name</label>
    <input type="text" name="customer" placeholder="Your name" required>

    <label>Phone Number</label>
    <input type="tel" name="phone" placeholder="Your phone number" required>

    <label>Shipping Address</label>
    <textarea name="address" placeholder="Your full address" required></textarea>

    <label>Select Product</label>
    <select name="product" required>
      <option value="HG001 - Hair Shampoo">Hair Shampoo - 159 Baht</option>
      <option value="HG002 - Hair Serum">Hair Serum - 199 Baht</option>
    </select>

    <label>Quantity</label>
    <input type="number" name="quantity" min="1" value="1" required>

    <button type="submit">ORDER NOW</button>
  </form>
</section>
</html>
